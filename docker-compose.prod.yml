# Production stack for the VPS. Local development keeps using docker-compose.yml.
# Publish both services on loopback only. The Next.js app reaches the API as http://api:8080
# on the tacdent network; nothing here is exposed through host nginx.

name: tacdent-backend

services:
  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    mem_limit: 2560m
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks: [tacdent]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    ports:
      # Loopback debug only. The site talks to this API over the Docker network.
      - "127.0.0.1:${API_PORT:-8082}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=mssql,1433;Database=tacdent;User Id=tacdent_app;Password=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Auth__AdminEmail: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      Auth__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Cors__Origins__0: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      AllowedHosts: ${ALLOWED_HOSTS:-api;localhost;127.0.0.1}
      Recaptcha__Enabled: ${RECAPTCHA_ENABLED:?Set RECAPTCHA_ENABLED in .env}
      Recaptcha__SecretKey: ${RECAPTCHA_SECRET_KEY:-}
      InternalApi__Key: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      ForwardedHeaders__KnownProxies__0: ${TRUSTED_PROXY_IP:?Set TRUSTED_PROXY_IP in .env}
    volumes:
      - ./logs:/app/logs
    networks: [tacdent]
    depends_on:
      mssql:
        condition: service_healthy

networks:
  tacdent:
    name: tacdent
    driver: bridge
    ipam:
      config:
        - subnet: ${TACDENT_SUBNET:-172.30.0.0/16}

volumes:
  mssql_data:
